<!DOCTYPE html>
<html>
<head>
  <title>FILO Admin</title>
  <style>
    body { font-family: Arial; padding: 40px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>FILO Admin Panel</h2>

<input id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>
<input id="image" placeholder="Image URL">
<input id="date" placeholder="Date">

<button onclick="addNews()">Upload News</button>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbxlOS7YfF0DiyR8jVkSVFGu3oke5NDFtykYJHAMJMwaFYoCumrzm6feOQ4lMVdzMCQ/exec";

function addNews() {
  const data = {
    title: document.getElementById("title").value,
    description: document.getElementById("desc").value,
    image: document.getElementById("image").value,
    date: document.getElementById("date").value
  };

  fetch(SHEET_API, {
    method: "POST",
    body: JSON.stringify(data)
  });

  alert("News added!");
}
</script>

</body>
</html>
