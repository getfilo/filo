<!DOCTYPE html>
<html>
<head>
  <title>FILO Admin Naren Hullatti</title>
  <style>
    body { font-family: Arial; padding: 40px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>FILO Admin Panel</h2>

<input id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>
<input id="date" placeholder="Date">

<button onclick="addNews()">Upload News</button>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbzpwcwyurgC3OJDZiEbav1t887zRjxb5-j_6ucvgidrbahtoTyAuE7R3saFrTnS9sc8/exec";

function addNews() {
  const data = {
    title: document.getElementById("title").value,
    description: document.getElementById("desc").value,
    date: document.getElementById("date").value
  };

  fetch("YOUR_GOOGLE_SCRIPT_URL", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(res => {
    console.log(res);
    alert("News updated successfully!");
  })
  .catch(err => {
    console.error("Error:", err);
    alert("Failed to update news");
  });
}
</script>

</body>
</html>
