<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FILO Admin</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Inter",sans-serif;
    }

    body{
      background:#ffffff;
      color:#111;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      padding:20px;
    }

    /* Background Glow */

    .bg-glow{
      position:absolute;
      width:500px;
      height:500px;

      background:radial-gradient(
        circle,
        rgba(0,0,0,0.05),
        transparent 70%
      );

      filter:blur(40px);

      animation:float 8s ease-in-out infinite;
    }

    @keyframes float{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-25px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    /* Card */

    .card{

  position:relative;
  z-index:2;

  width:430px;

  max-height:92vh;

  overflow-y:auto;

  padding:40px;

  border-radius:28px;

  background:rgba(255,255,255,0.92);

  backdrop-filter:blur(12px);

  border:1px solid rgba(0,0,0,0.06);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.06),
  0 2px 10px rgba(0,0,0,0.03);

  animation:fadeUp 1s ease;

}

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(25px);
      }

      to{
        opacity:1;
        transform:translateY(0px);
      }

    }

    .logo{
      font-size:42px;
      font-weight:700;
      letter-spacing:3px;
      margin-bottom:10px;
    }

    .subtitle{
      color:#666;
      line-height:1.6;
      margin-bottom:35px;
      font-size:14px;
    }

    .input-box{
      position:relative;
      margin-bottom:16px;
    }

    input{
      width:100%;
      padding:15px;
      border-radius:14px;
      border:1px solid #e5e5e5;
      background:#fafafa;
      font-size:15px;
      outline:none;
      transition:0.3s;
    }

    input:focus{
      border-color:#111;
      background:white;
      transform:scale(1.01);

      box-shadow:
      0 5px 15px rgba(0,0,0,0.05);
    }

    .toggle-password{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#666;
      font-size:14px;
      user-select:none;
    }

    /* Buttons */

    .btn{
      position:relative;
      width:100%;
      padding:15px;
      border:none;
      border-radius:16px;
      background:#111;
      color:white;
      font-size:15px;
      cursor:pointer;
      overflow:hidden;
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-3px) scale(1.02);

      box-shadow:
      0 15px 30px rgba(0,0,0,0.15);
    }

    .btn::before{
      content:'';

      position:absolute;
      top:0;
      left:-120%;

      width:100%;
      height:100%;

      background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
      );

      transition:0.7s;
    }

    .btn:hover::before{
      left:120%;
    }

    .error{
      margin-top:15px;
      color:#d62839;
      text-align:center;
      font-size:14px;
    }

    /* Loading */

    .loading-screen{
      display:none;
      text-align:center;
    }

    .loader{
      width:60px;
      height:60px;

      border:5px solid #eeeeee;
      border-top:5px solid #111;

      border-radius:50%;

      margin:0 auto 25px;

      animation:spin 1s linear infinite;
    }

    @keyframes spin{

      0%{
        transform:rotate(0deg);
      }

      100%{
        transform:rotate(360deg);
      }

    }

    /* Portal */

    .portal{
      display:none;
    }

    .portal h2{
      font-size:28px;
      margin-bottom:10px;
    }

    .portal p{
      color:#666;
      margin-bottom:20px;
    }

    /* Chat */

    .chat-title{
      font-size:14px;
      color:#666;
      margin-bottom:12px;
    }

    .chat-box{
      height:300px;
      overflow-y:auto;

      background:#fafafa;

      border:1px solid #e5e5e5;

      border-radius:18px;

      padding:15px;

      margin-bottom:15px;
    }

    .message{
      background:white;
      padding:12px;
      border-radius:14px;
      margin-bottom:12px;
      border:1px solid #f0f0f0;
    }

    .message-user{
      font-size:13px;
      font-weight:600;
      margin-bottom:6px;
    }

    .message-text{
      color:#555;
      line-height:1.5;
    }

    .chat-input-row{
      display:flex;
      gap:10px;
      margin-bottom:18px;
    }

    .chat-input{
      flex:1;
      margin-bottom:0;
    }

    .send-btn{
      width:110px;
    }

    .logout{
      background:#f3f3f3;
      color:#111;
    }

    .logout:hover{
      background:#111;
      color:white;
    }

  </style>
</head>

<body>

  <!-- Background -->

  <div class="bg-glow"></div>

  <!-- LOGIN -->

  <div class="card" id="loginBox">

<div style="text-align:center; margin-bottom:18px;">

  <img
    src="FILO.png"
    alt="FILO Logo"
    style="
      width:85px;
      height:85px;
      object-fit:cover;
      border-radius:24px;
      box-shadow:
      0 10px 25px rgba(0,0,0,0.08);
    "
  >

</div>   

 <div class="logo" style="
  text-align:center;
">
  FILO
</div>

    <div class="subtitle">
      STEM Globe R&D<br>
      Admin Access Only
    </div>

    <!-- Username -->

    <div class="input-box">

      <input
        type="text"
        id="username"
        placeholder="Username"
      >

    </div>

    <!-- Password -->

    <div class="input-box">

      <input
        type="password"
        id="password"
        placeholder="Passcode"
      >

      <span
        class="toggle-password"
        onclick="togglePassword()"
        id="toggleBtn"
      >
        Show
      </span>

    </div>

    <!-- Login Button -->

    <button class="btn" onclick="login()">
      Access Portal
    </button>

    <div class="error" id="error"></div>

  </div>

  <!-- LOADING -->

  <div class="card loading-screen" id="loadingScreen">

    <div class="loader"></div>

    <h2>Admin Portal Initiating</h2>

    <p style="color:#666;">
      Secure access verification in progress...
    </p>

  </div>

  <!-- PORTAL -->

  <div class="card portal" id="portalBox">

    <h2 id="welcomeName">
      Welcome Admin
    </h2>

    <p id="welcomeRole">
      FILO Admin Portal
    </p>


    <!-- Chat -->

    <div class="chat-title">
      FILO Team Chat Room
    </div>

    <div class="chat-box" id="chatBox"></div>

    <!-- Chat Input -->

    <div class="chat-input-row">

      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Type message..."
      >

      <button
        class="btn send-btn"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

    <!-- Logout -->

    <button class="btn logout" onclick="logout()">
      Logout
    </button>

  <script>

    // =========================
    // FIREBASE CONFIG
    // Replace With Your Config
    // =========================

  const firebaseConfig = {
  apiKey: "AIzaSyDrp7tPmWbTnVpBbwurZjFdo0tZFcHHpWU",
  authDomain: "filo-admin-portal.firebaseapp.com",
  projectId: "filo-admin-portal",
  storageBucket: "filo-admin-portal.firebasestorage.app",
  messagingSenderId: "276967896511",
  appId: "1:276967896511:web:0c5caae09709c2a9d01d0a",
  measurementId: "G-GC87SLTNY8"
};
    // Initialize Firebase

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    // =========================
    // ADMINS
    // =========================

    const admins = [

      {
        username: "naren.16@filo",
        password: "16#filo",
        name: "Naren Hullatti",
        role: "Founder, CEO - FILO"
      },

      {
        username: "neesa.17@filo",
        password: "17#filo",
        name: "Neesa Divekar",
        role: "Co-founder, COO - FILO"
      },

      {
        username: "rishith.18@filo",
        password: "18#filo",
        name: "Rishith M Naik",
        role: "Co-founder, CTO - FILO"
      }

    ];

    // =========================
    // CURRENT USER
    // =========================

    let currentUser = "";

    // =========================
    // LOGIN
    // =========================

    function login(){

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");

      let accessGranted = false;

      for(let i = 0; i < admins.length; i++){

        if(
          username === admins[i].username &&
          password === admins[i].password
        ){

          accessGranted = true;

          currentUser = admins[i].name;

          document.getElementById("loginBox").style.display = "none";

          document.getElementById("loadingScreen").style.display = "block";

          setTimeout(() => {

            document.getElementById("loadingScreen").style.display = "none";

            document.getElementById("portalBox").style.display = "block";

            document.getElementById("welcomeName").innerText =
              admins[i].name;

           document.getElementById("welcomeName").innerText =
           "Welcome " + admins[i].name;

            loadMessages();

          }, 2200);

        }

      }

      if(accessGranted === false){

        error.innerText =
          "Invalid Username or Passcode";

      }

    }

    // =========================
    // SEND MESSAGE
    // =========================

    function sendMessage(){

      const message =
        document.getElementById("chatInput").value;

      if(message.trim() === "") return;

      db.collection("chatroom")
      .add({

        user: currentUser,

        text: message,

        time: new Date()

      })

      .then(() => {

        document.getElementById("chatInput").value = "";

      });

    }

   // =========================
// DELETE MESSAGE
// =========================

function deleteMessage(messageId){

  db.collection("chatroom")
  .doc(messageId)
  .delete();

}

// =========================
// EDIT MESSAGE
// =========================

function editMessage(messageId, oldText){

  const newText =
    prompt("Edit your message:", oldText);

  // IF Cancelled

  if(newText === null) return;

  // IF Empty

  if(newText.trim() === "") return;

  db.collection("chatroom")
  .doc(messageId)
  .update({

    text: newText

  });

}

    // =========================
    // LOAD MESSAGES
    // =========================

   function loadMessages(){

  db.collection("chatroom")
  .orderBy("time")

  .onSnapshot((snapshot) => {

    const chatBox =
      document.getElementById("chatBox");

    chatBox.innerHTML = "";

    snapshot.forEach((doc) => {

      const data = doc.data();

      // Show Edit/Delete only for own messages

      let controls = "";

      if(data.user === currentUser){

        controls = `

          <div style="
            margin-top:10px;
            display:flex;
            gap:10px;
          ">

            <button
              onclick="editMessage('${doc.id}', \`${data.text}\`)"
              style="
                border:none;
                background:#f5f5f5;
                padding:6px 12px;
                border-radius:10px;
                cursor:pointer;
                font-size:12px;
              "
            >
              Edit
            </button>

            <button
              onclick="deleteMessage('${doc.id}')"
              style="
                border:none;
                background:#ffecec;
                color:#d62839;
                padding:6px 12px;
                border-radius:10px;
                cursor:pointer;
                font-size:12px;
              "
            >
              Delete
            </button>

          </div>

        `;

      }

      chatBox.innerHTML += `

        <div class="message">

          <div class="message-user">
            ${data.user}
          </div>

          <div class="message-text">
            ${data.text}
          </div>

          ${controls}

        </div>

      `;

    });

    // Auto Scroll Bottom

    chatBox.scrollTop =
      chatBox.scrollHeight;

  });

}

    // =========================
    // LOGOUT
    // =========================

    function logout(){

      document.getElementById("portalBox").style.display = "none";

      document.getElementById("loginBox").style.display = "block";

      document.getElementById("username").value = "";

      document.getElementById("password").value = "";

      document.getElementById("error").innerText = "";

    }

    // =========================
    // SHOW PASSWORD
    // =========================

    function togglePassword(){

      const passwordInput =
        document.getElementById("password");

      const toggleBtn =
        document.getElementById("toggleBtn");

      if(passwordInput.type === "password"){

        passwordInput.type = "text";

        toggleBtn.innerText = "Hide";

      }

      else{

        passwordInput.type = "password";

        toggleBtn.innerText = "Show";

      }

    }

  </script>

</body>
</html>
